name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: vickusen1
          password: ${{ secrets.DOCKER_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- VOTE SERVICE ---
      - name: Build Vote Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          load: true
          tags: vote-local:${{ github.sha }}

      - name: Scan Vote Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vote-local:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Vote Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          push: true
          tags: |
            vickusen1/vote:${{ github.sha }}
            vickusen1/vote:latest

      # --- RESULT SERVICE ---
      - name: Build Result Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./result
          load: true
          tags: result-local:${{ github.sha }}

      - name: Scan Result Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'result-local:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Result Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./result
          push: true
          tags: |
            vickusen1/result:${{ github.sha }}
            vickusen1/result:latest
